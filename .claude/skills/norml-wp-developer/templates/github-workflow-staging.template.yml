# Generated by norml-wp-developer on init. Deploys this theme to
# staging when changes land on `develop`. No backup gate — staging is
# intentionally low-stakes.
#
# Required GitHub Actions secrets (add at .../settings/secrets/actions):
#   STAGING_SSH_KEY      — full private key contents
#   STAGING_SSH_HOST     — hostname or IP
#   STAGING_SSH_PORT     — usually 22
#   STAGING_SSH_USER     — SSH username
#   STAGING_THEME_PATH   — absolute theme path on staging
#   STAGING_WP_PATH      — absolute WP install path on staging
#   STAGING_URL          — e.g. staging.acme.com (no protocol)

name: Deploy to staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Composer install (no dev)
        if: hashFiles('composer.json') != ''
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: npm install
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Build assets
        if: hashFiles('package.json') != ''
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.STAGING_SSH_PORT }} ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync to staging
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.STAGING_SSH_PORT }}" \
            ./ "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:${{ secrets.STAGING_THEME_PATH }}/"

      - name: Post-deploy (cache flush + Acorn view cache)
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.STAGING_SSH_PORT }} \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "cd '${{ secrets.STAGING_WP_PATH }}' && wp cache flush 2>&1 || true && wp acorn view:cache 2>&1 || true"

      - name: Smoke test
        run: curl -sfL -o /dev/null "https://${{ secrets.STAGING_URL }}/" || (echo "Smoke test failed" && exit 1)
