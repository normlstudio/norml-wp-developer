# Generated by norml-wp-developer on init. Deploys this theme to
# production when a tag matching v* is pushed (for full-pipeline) or
# when manually triggered (for prod-direct-with-git, on push to main).
#
# *** BACKUP ACKNOWLEDGEMENT GATE ***
#
# This workflow runs the deploy only if the `i_have_a_backup`
# workflow_dispatch input equals "yes". Triggers via tag push set it to
# "yes" automatically — the assumption is you typed `git tag` with a
# clean conscience after verifying a backup exists. If you tagged
# without a backup and something breaks, that's on you.
#
# Required GitHub Actions secrets:
#   PRODUCTION_SSH_KEY      — full private key contents
#   PRODUCTION_SSH_HOST
#   PRODUCTION_SSH_PORT
#   PRODUCTION_SSH_USER
#   PRODUCTION_THEME_PATH
#   PRODUCTION_WP_PATH
#   PRODUCTION_URL

name: Deploy to production

on:
  push:
    tags:
      - 'v*'
    # For prod-direct-with-git projects: uncomment the next 2 lines and
    # comment out the tags trigger above.
    # branches:
    #   - main
  workflow_dispatch:
    inputs:
      i_have_a_backup:
        description: 'Type "yes" only if you have a backup (host or manual). Default no.'
        required: true
        default: 'no'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # For tag pushes we assume a backup exists (you tagged it after
    # verifying). For manual workflow_dispatch, only run if input is
    # "yes".
    if: github.event_name == 'push' || github.event.inputs.i_have_a_backup == 'yes'
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Composer install (no dev)
        if: hashFiles('composer.json') != ''
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: npm install
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Build assets
        if: hashFiles('package.json') != ''
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.PRODUCTION_SSH_PORT }} ${{ secrets.PRODUCTION_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync to production
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.PRODUCTION_SSH_PORT }}" \
            ./ "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}:${{ secrets.PRODUCTION_THEME_PATH }}/"

      - name: Post-deploy (cache flush + Acorn view cache)
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.PRODUCTION_SSH_PORT }} \
            "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" \
            "cd '${{ secrets.PRODUCTION_WP_PATH }}' && wp cache flush 2>&1 || true && wp acorn view:cache 2>&1 || true"

      - name: Smoke test
        run: curl -sfL -o /dev/null "https://${{ secrets.PRODUCTION_URL }}/" || (echo "Smoke test failed" && exit 1)

      - name: Tag the deploy in the repo (if tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: echo "Deployed ${GITHUB_REF#refs/tags/} to production."
